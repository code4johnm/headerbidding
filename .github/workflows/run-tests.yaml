# This workflow will run all tests as well as pre-commit

name: Tests and linting
on:
  push:
    branches:
      - master
  pull_request:
  merge_group:
  schedule:
    - cron: "0 0 */2 * *"
  workflow_dispatch:

jobs:
  # Real check that does not need conda/Firefox. Run #53 (and every
  # scheduled run after May 2026) died in ./.github/actions/setup with
  # exit 126: scripts/install-conda.sh was mode 100644 (Permission denied).
  # This job fails if those execute bits regress.
  ci-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify CI scripts are executable and parse
        run: |
          set -euo pipefail
          failed=0
          for f in scripts/install-conda.sh scripts/install-firefox.sh scripts/ci.sh \
                   scripts/reap-ci-leftovers.sh \
                   scripts/build-extension.sh scripts/repin.sh scripts/run-on-osx-via-docker.sh; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::missing"
              failed=1
              continue
            fi
            if [ ! -x "$f" ]; then
              echo "::error file=$f::not executable (GitHub Actions exit 126)"
              failed=1
            fi
            bash -n "$f"
            echo "ok $f mode=$(stat -c '%a' "$f")"
          done
          if [ ! -f openwpm/storage/schema.sql ]; then
            echo "::error file=openwpm/storage/schema.sql::missing (StorageController hang / FileNotFoundError)"
            failed=1
          fi
          exit "$failed"
      - name: Syntax-check Python sources
        run: python3 -m compileall -q openwpm test demo.py crawler.py custom_command.py

  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: timeout --signal=TERM --kill-after=30s 12m pre-commit run --all

  demo:
    runs-on: ubuntu-latest
    # Unbounded demo on #56 sat 6h after schema.sql FileNotFoundError.
    # This bounds the job; it does not hide a hang (inner timeout is 15m).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: timeout --signal=TERM --kill-after=30s 15m python demo.py --headless
      - name: Reap leftover demo processes
        if: always()
        run: bash scripts/reap-ci-leftovers.sh
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        group: [1, 2, 3, 4, 5, 6, 7]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: bash scripts/ci.sh
        env:
          DISPLAY: ":99.0"
          GROUP: ${{ matrix.group }}
          SPLITS: 7
      - name: Reap leftover test processes
        if: always()
        run: bash scripts/reap-ci-leftovers.sh
      - name: Test failure summary
        if: always()
        continue-on-error: true
        run: |
          python - <<'PYEOF'
          import xml.etree.ElementTree as ET, os, sys
          if not os.path.exists("junit-report.xml"):
              sys.exit(0)
          tree = ET.parse("junit-report.xml")
          root = tree.getroot()
          # Collect suite-level stats
          suites = list(root.iter("testsuite"))
          total = sum(int(s.get("tests", 0)) for s in suites)
          fails = sum(int(s.get("failures", 0)) for s in suites)
          errs = sum(int(s.get("errors", 0)) for s in suites)
          bad = fails + errs
          if bad == 0:
              sys.exit(0)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"### Group ${{ matrix.group }}: {bad}/{total} test(s) failed\n\n")
              for tc in root.iter("testcase"):
                  for tag in ("failure", "error"):
                      elem = tc.find(tag)
                      if elem is None:
                          continue
                      name = tc.get("name", "?")
                      cls = tc.get("classname", "")
                      short = cls.rsplit(".", 1)[-1] if cls else ""
                      etype = elem.get("type", tag)
                      msg = elem.get("message", "")
                      trace = (elem.text or "").rstrip()
                      # Summary line shows test + exception type
                      f.write(f"<details>\n<summary>")
                      f.write(f"<code>{short}::{name}</code> — {etype}")
                      if msg:
                          oneliner = msg.split("\n")[0][:120]
                          f.write(f": {oneliner}")
                      f.write(f"</summary>\n\n```\n{trace}\n```\n</details>\n\n")
          PYEOF
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.group }}
          path: coverage.xml

  upload-coverage:
    runs-on: ubuntu-latest
    needs: tests
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: .
          fail_ci_if_error: false
